server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate never creates or alters tables.
      ddl-auto: none
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    default-property-inclusion: non_null # omit null fields when serializing JSON
  kafka:
    bootstrap-servers: ${HMDP_KAFKA_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 20
logging:
  level:
    com.hmdp: debug
  pattern:
    dateformat: mm:ss.SSS
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hmdp.seckill.consume: true
        hmdp.cdc.event.delay: true
        hmdp.mq.consume: true
        hmdp.mq.send: true
        hmdp.kafka.event.delay: true
  endpoint:
    health:
      show-details: never
  health:
    # A mail outage must not mark the API as down; login-code delivery reports its own failures.
    mail:
      enabled: false
citylens:
  reliability:
    scheduling-enabled: true
    max-deliveries: 5
    claim-idle-ms: 30000
    order-timeout-minutes: 30

hmdp:
  experience:
    enabled: ${HMDP_EXPERIENCE_ENABLED:false}
  demo:
    # Publishes surplus-bag drops for a few seeded shops so a fresh demo always has one to claim.
    drops-enabled: ${HMDP_DEMO_DROPS_ENABLED:false}
    drop-shop-ids: ${HMDP_DEMO_DROP_SHOP_IDS:1,3,7,13,15}
    drop-stock: ${HMDP_DEMO_DROP_STOCK:8}
  analytics:
    enabled: ${HMDP_ANALYTICS_ENABLED:false}
    bootstrap-servers: ${HMDP_KAFKA_SERVERS:127.0.0.1:9092}
    topic: HmdpShopBehavior
    group: ${HMDP_KAFKA_GROUP:hmdp-heat-v1}
  mq:
    enabled: ${HMDP_MQ_ENABLED:false}
    seckill-enabled: ${HMDP_MQ_SECKILL_ENABLED:false}
    group-prefix: ${HMDP_MQ_GROUP_PREFIX:hmdp}
    # One Kafka topic per logical consumer group: hmdp.biz.feed, hmdp.biz.orders, ...
    topic-prefix: hmdp.biz.
    topic-partitions: 3
    topic-replication-factor: ${HMDP_MQ_REPLICATION_FACTOR:1}
    consumer-enabled: true
    lease-seconds: 60
    relay-batch-size: 20
    send-timeout-ms: 10000
  monitor-token: ${HMDP_MONITOR_TOKEN:}
  security:
    # HS256 key, at least 32 bytes. The default only exists so a fresh clone runs locally;
    # every shared or deployed environment must set HMDP_JWT_SECRET.
    jwt-secret: ${HMDP_JWT_SECRET:local-development-only-jwt-secret-change-me}
    access-token-ttl: ${HMDP_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${HMDP_REFRESH_TOKEN_TTL:7d}
  mail:
    # Login codes are emailed when enabled (SMTP from SPRING_MAIL_HOST/PORT, e.g. Mailpit).
    enabled: ${HMDP_MAIL_ENABLED:false}
    from: ${HMDP_MAIL_FROM:no-reply@harbourdrop.local}
    # Demo hosts without SMTP only: write codes to the log instead of failing. Never in production.
    log-codes: ${HMDP_LOGIN_CODE_LOG:false}
  cache:
    enabled: true
  cdc:
    # Debezium (Kafka Connect) publishes binlog changes to <topic-prefix>.<schema>.<table>.
    enabled: ${HMDP_CDC_ENABLED:false}
    schema: ${HMDP_CDC_SCHEMA:hmdp}
    topic-prefix: ${HMDP_CDC_TOPIC_PREFIX:hmdp-cdc}
    group: ${HMDP_CDC_GROUP:hmdp-cache-cdc}
