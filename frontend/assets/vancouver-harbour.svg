<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B8FA8"/>
      <stop offset=".42" stop-color="#A9C8CC"/>
      <stop offset=".7" stop-color="#F6D8B4"/>
      <stop offset=".88" stop-color="#F5B47A"/>
      <stop offset="1" stop-color="#F2994A"/>
    </linearGradient>
    <radialGradient id="glow" cx="1290" cy="350" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9C4" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#FCD29C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F7B985" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="600" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FAFB3"/>
      <stop offset=".35" stop-color="#3C8285"/>
      <stop offset="1" stop-color="#12403E"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="380" x2="0" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8F3F1" stop-opacity="0"/>
      <stop offset="1" stop-color="#E8F3F1" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="hazeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="hazeMask">
      <rect y="380" width="1600" height="240" fill="url(#hazeFade)"/>
    </mask>
    <pattern id="win" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="4" y="6" width="5" height="6" fill="#F8CD96" opacity=".55"/>
    </pattern>
  </defs>

  <!-- sky -->
  <rect width="1600" height="620" fill="url(#sky)"/>
  <rect width="1600" height="620" fill="url(#glow)"/>
  <circle cx="1290" cy="348" r="46" fill="#FFE2B0"/>

  <!-- soft clouds -->
  <g fill="#FFFFFF" opacity=".32">
    <ellipse cx="1080" cy="150" rx="150" ry="16"/>
    <ellipse cx="1150" cy="134" rx="80" ry="14"/>
    <ellipse cx="1460" cy="250" rx="120" ry="12"/>
    <ellipse cx="330" cy="200" rx="170" ry="12"/>
    <ellipse cx="820" cy="300" rx="110" ry="9"/>
  </g>

  <!-- far snowy range -->
  <path d="M0 480 L120 432 L220 455 L380 400 L520 440 L700 300 L800 360 L960 250 L1060 320 L1180 290 L1290 340 L1420 240 L1520 300 L1600 282 L1600 610 L0 610 Z" fill="#9DBCC8"/>
  <g fill="#FBFDFC">
    <path d="M380 400 L432 415 L415 414 L400 421 L385 412 L366 419 L350 414 L336 415 Z" opacity=".85"/>
    <path d="M700 300 L758 335 L742 332 L728 342 L712 331 L696 344 L680 332 L668 340 L655 335 Z"/>
    <path d="M960 250 L1010 285 L995 281 L980 292 L962 282 L945 294 L928 283 L909 285 Z"/>
    <path d="M1180 290 L1213 305 L1198 304 L1185 311 L1170 303 L1150 309 L1120 305 Z"/>
    <path d="M1420 240 L1487 280 L1470 276 L1455 288 L1438 276 L1420 290 L1402 277 L1385 286 L1368 280 Z"/>
  </g>
  <g fill="#D7E6EA" opacity=".9">
    <path d="M960 250 L1010 285 L995 281 L980 292 L962 282 Z"/>
    <path d="M1420 240 L1487 280 L1470 276 L1455 288 L1438 276 Z"/>
    <path d="M700 300 L758 335 L742 332 L728 342 L712 331 Z"/>
  </g>

  <!-- mid ridge -->
  <path d="M0 540 C150 505 260 522 380 498 S600 468 720 432 S900 414 1000 440 S1200 384 1320 410 S1500 402 1600 428 L1600 620 L0 620 Z" fill="#5B8FA8"/>

  <!-- near forested shore -->
  <path d="M0 586 C160 568 300 580 460 566 S760 552 900 562 C1050 548 1250 556 1600 548 L1600 620 L0 620 Z" fill="#2E6461"/>
  <path d="M0 596 C200 586 420 594 640 584 S1000 580 1600 576 L1600 620 L0 620 Z" fill="#1F4F4C"/>

  <!-- haze over the calm left side -->
  <rect y="380" width="1600" height="240" fill="url(#haze)" mask="url(#hazeMask)"/>

  <!-- back towers -->
  <g fill="#3A6676">
    <rect x="880" y="470" width="50" height="140"/>
    <rect x="950" y="430" width="40" height="180"/>
    <rect x="1010" y="400" width="55" height="210"/>
    <path d="M1100 390 L1145 375 L1145 610 L1100 610 Z"/>
    <rect x="1180" y="420" width="60" height="190"/>
    <rect x="1270" y="360" width="50" height="250" rx="6"/>
    <rect x="1350" y="440" width="40" height="170"/>
    <path d="M1420 425 Q1450 400 1480 425 L1480 610 L1420 610 Z"/>
    <rect x="1500" y="455" width="45" height="155"/>
    <rect x="1550" y="430" width="50" height="180"/>
  </g>

  <!-- front towers -->
  <g fill="#1B3D46">
    <rect x="860" y="520" width="60" height="90"/>
    <rect x="925" y="490" width="45" height="120"/>
    <path d="M975 470 L1025 450 L1025 610 L975 610 Z"/>
    <rect x="1045" y="470" width="70" height="140"/>
    <path d="M1125 362 L1175 340 L1175 610 L1125 610 Z"/>
    <rect x="1148" y="318" width="4" height="30"/>
    <rect x="1185" y="455" width="55" height="155"/>
    <rect x="1250" y="400" width="40" height="210" rx="4"/>
    <rect x="1300" y="480" width="75" height="130"/>
    <path d="M1385 445 L1407 430 L1430 445 L1430 610 L1385 610 Z"/>
    <rect x="1440" y="495" width="60" height="115"/>
    <rect x="1510" y="460" width="40" height="150"/>
    <rect x="1560" y="510" width="40" height="100"/>
  </g>
  <g fill="url(#win)">
    <path d="M1125 362 L1175 340 L1175 610 L1125 610 Z"/>
    <rect x="1045" y="470" width="70" height="140"/>
    <rect x="1300" y="480" width="75" height="130"/>
    <rect x="1510" y="460" width="40" height="150"/>
  </g>

  <!-- shoreline trees and land under the city -->
  <g fill="#173A37">
    <ellipse cx="790" cy="598" rx="34" ry="20"/>
    <ellipse cx="830" cy="592" rx="28" ry="24"/>
    <ellipse cx="760" cy="604" rx="40" ry="12"/>
  </g>
  <rect x="740" y="600" width="860" height="14" fill="#12312E"/>

  <!-- water -->
  <rect y="610" width="1600" height="290" fill="url(#water)"/>

  <!-- city reflections -->
  <g fill="#1B3D46" opacity=".28">
    <rect x="860" y="614" width="60" height="40"/>
    <rect x="975" y="614" width="50" height="70"/>
    <rect x="1045" y="614" width="70" height="60"/>
    <rect x="1125" y="614" width="50" height="110"/>
    <rect x="1250" y="614" width="40" height="80"/>
    <rect x="1300" y="614" width="75" height="50"/>
    <rect x="1440" y="614" width="60" height="45"/>
    <rect x="1510" y="614" width="40" height="66"/>
  </g>

  <!-- sun reflection -->
  <g fill="#FFD9A6">
    <rect x="1230" y="622" width="120" height="5" rx="2.5" opacity=".9"/>
    <rect x="1210" y="640" width="160" height="5" rx="2.5" opacity=".75"/>
    <rect x="1245" y="658" width="95" height="5" rx="2.5" opacity=".7"/>
    <rect x="1200" y="678" width="130" height="4" rx="92" opacity=".55"/>
    <rect x="1260" y="698" width="80" height="4" rx="92" opacity=".5"/>
    <rect x="1225" y="722" width="110" height="4" rx="92" opacity=".4"/>
    <rect x="1270" y="748" width="60" height="3" rx="1.5" opacity=".35"/>
  </g>

  <!-- ripples -->
  <g stroke="#E8F3F1" stroke-linecap="round" stroke-width="2.5" opacity=".35">
    <path d="M90 660 H170"/>
    <path d="M260 700 H310"/>
    <path d="M140 760 H240"/>
    <path d="M420 650 H470"/>
    <path d="M560 735 H640"/>
    <path d="M700 680 H740"/>
    <path d="M860 770 H930"/>
    <path d="M1360 700 H1440"/>
    <path d="M1480 660 H1520"/>
    <path d="M1400 770 H1500"/>
  </g>

  <!-- sailboat -->
  <g>
    <path d="M985 648 L985 716" stroke="#12312E" stroke-width="3"/>
    <path d="M989 652 L989 712 L1036 712 Z" fill="#FBF4EA"/>
    <path d="M981 664 L981 712 L948 712 Z" fill="#F2994A"/>
    <path d="M938 718 L1040 718 L1026 734 L952 734 Z" fill="#12312E"/>
    <path d="M944 742 L1034 742" stroke="#FBF4EA" stroke-width="3" stroke-linecap="round" opacity=".4"/>
    <path d="M962 752 L1016 752" stroke="#FBF4EA" stroke-width="2.5" stroke-linecap="round" opacity=".3"/>
  </g>

  <!-- seaplane -->
  <g fill="#12312E" opacity=".85">
    <path d="M1352 180 Q1354 172 1367 172 L1412 174 Q1420 175 1422 180 L1354 184 Z"/>
    <path d="M1354 180 L1345 164 L1353 164 L1364 175 Z"/>
    <rect x="1374" y="167" width="32" height="4" rx="2"/>
    <path d="M1378 184 L1375 194 M1404 183 L1406 194" stroke="#12312E" stroke-width="2"/>
    <rect x="1362" y="193" width="54" height="4" rx="2"/>
    <rect x="1422" y="171" width="2" height="18" rx="1"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#12312E" stroke-width="2" stroke-linecap="round" opacity=".45">
    <path d="M610 230 q8 -7 14 0 q6 -7 14 0"/>
    <path d="M650 252 q6 -5 11 0 q5 -5 11 0"/>
  </g>

  <!-- seawall -->
  <path d="M0 842 C420 822 900 838 1600 800 L1600 900 L0 900 Z" fill="#1D3F3B"/>
  <path d="M0 842 C420 822 900 838 1600 800 L1600 814 C900 852 420 836 0 856 Z" fill="#E9DCC6"/>
  <path d="M0 866 C420 846 900 862 1600 826" fill="none" stroke="#2A524D" stroke-width="2" opacity=".7"/>
  <g stroke="#12312E" stroke-width="3" stroke-linecap="round">
    <path d="M1120 820 V784"/>
    <path d="M1330 812 V774"/>
    <path d="M1540 803 V765"/>
  </g>
  <g fill="#F8CD96">
    <circle cx="1120" cy="782" r="4"/>
    <circle cx="1330" cy="772" r="4"/>
    <circle cx="1540" cy="763" r="4"/>
  </g>
</svg>
