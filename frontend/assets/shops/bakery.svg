  </g>
  <!-- croissants -->
  <ellipse cx="560" cy="430" rx="120" ry="18" fill="#000" opacity=".08"/>
  <use href="#croissant" transform="translate(560 400) rotate(-6)"/>
  <ellipse cx="440" cy="520" rx="120" ry="18" fill="#000" opacity=".08"/>
  <use href="#croissant" transform="translate(440 492) rotate(4) scale(1.05)"/>
  <!-- small jam jar -->
  <ellipse cx="680" cy="512" rx="44" ry="10" fill="#000" opacity=".08"/>
  <rect x="644" y="450" width="72" height="62" rx="14" fill="#F2994A"/>
