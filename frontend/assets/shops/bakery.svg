    <path d="M0 470 H800"/><path d="M0 545 H800"/>
  </g>
  <!-- board -->
  <ellipse cx="320" cy="458" rx="190" ry="30" fill="#000" opacity=".08"/>
  <rect x="130" y="420" width="380" height="34" rx="17" fill="#B9824F"/>
  <rect x="130" y="420" width="380" height="12" rx="6" fill="#C9935C"/>
  <circle cx="530" cy="437" r="14" fill="#B9824F"/>
  <!-- loaf -->
  <ellipse cx="320" cy="370" rx="160" ry="74" fill="#B86A2E"/>
  <ellipse cx="320" cy="360" rx="152" ry="66" fill="#C9783A"/>
  <ellipse cx="310" cy="340" rx="118" ry="38" fill="#DB8F4E"/>
  <g fill="none" stroke="#F2C48D" stroke-width="10" stroke-linecap="round">
