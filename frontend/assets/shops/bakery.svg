        <ellipse cx="-62" cy="-16" rx="12" ry="6" transform="rotate(-22 -62 -16)"/>
        <ellipse cx="54" cy="-16" rx="12" ry="6" transform="rotate(22 54 -16)"/>
      </g>
    </g>
  </defs>
  <rect width="800" height="600" fill="#FBF4EA"/>
