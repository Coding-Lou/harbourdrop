<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <g id="croissant">
      <g fill="#E8A257" stroke="#B86A2E" stroke-width="4">
        <ellipse cx="-96" cy="14" rx="24" ry="15" transform="rotate(-38 -96 14)"/>
        <ellipse cx="96" cy="14" rx="24" ry="15" transform="rotate(38 96 14)"/>
        <ellipse cx="-58" cy="-2" rx="32" ry="27" transform="rotate(-22 -58 -2)"/>
        <ellipse cx="58" cy="-2" rx="32" ry="27" transform="rotate(22 58 -2)"/>
        <ellipse cx="0" cy="-10" rx="42" ry="35"/>
      </g>
      <g fill="#F5C27F" opacity=".8">
