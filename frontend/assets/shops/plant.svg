<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <g id="leaf">
      <path d="M0 0 C10 -26 40 -32 56 -22 C40 -4 18 6 0 0 Z" fill="#6DB06B"/>
      <path d="M4 -3 L46 -20" stroke="#4E9A5B" stroke-width="2"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="#12312E"/>
  <circle cx="400" cy="250" r="240" fill="#173E3A"/>
  <g opacity=".5">
    <use href="#leaf" transform="translate(70 120) rotate(-30) scale(1.6)"/>
    <use href="#leaf" transform="translate(690 80) rotate(150) scale(1.4)"/>
    <use href="#leaf" transform="translate(720 230) rotate(200) scale(1.2)"/>
  </g>
  <!-- table -->
  <rect y="420" width="800" height="180" fill="#1E4A45"/>
  <rect y="420" width="800" height="8" fill="#235650"/>
  <!-- napkin and fork -->
  <rect x="610" y="440" width="150" height="110" rx="10" fill="#F2994A" transform="rotate(-8 685 495)"/>
  <path d="M630 520 L750 500" stroke="#E8F3F1" stroke-width="8" stroke-linecap="round"/>
  <path d="M600 526 L636 520" stroke="#E8F3F1" stroke-width="14" stroke-linecap="round"/>
  <!-- bowl -->
  <ellipse cx="400" cy="520" rx="190" ry="24" fill="#000" opacity=".25"/>
  <path d="M180 360 C190 470 290 520 400 520 C510 520 610 470 620 360 Z" fill="#E8F3F1"/>
  <path d="M188 410 C230 440 570 440 612 410" fill="none" stroke="#0B7A75" stroke-width="10"/>
  <path d="M520 360 C540 450 500 500 430 518 C520 512 600 470 620 360 Z" fill="#CFE3DF"/>
  <ellipse cx="400" cy="360" rx="220" ry="58" fill="#FFFFFF"/>
  <ellipse cx="400" cy="362" rx="204" ry="50" fill="#E8D5A8"/>
  <g fill="#D9C08A">
    <circle cx="300" cy="372" r="3"/><circle cx="330" cy="388" r="3"/><circle cx="460" cy="392" r="3"/><circle cx="510" cy="380" r="3"/><circle cx="380" cy="396" r="3"/>
  </g>
  <!-- greens back -->
  <use href="#leaf" transform="translate(250 350) rotate(-40)"/>
  <use href="#leaf" transform="translate(280 345) rotate(-70)"/>
  <use href="#leaf" transform="translate(300 352) rotate(-15) scale(.9)"/>
  <ellipse cx="270" cy="356" rx="40" ry="14" fill="#4E9A5B"/>
  <!-- purple cabbage -->
  <g fill="none" stroke="#8E6BA8" stroke-width="5" stroke-linecap="round">
    <path d="M400 320 q20 8 40 0"/><path d="M396 330 q24 10 48 0"/><path d="M404 340 q20 8 38 -2"/>
  </g>
  <!-- avocado fan -->
  <g stroke="#4E7D3B" stroke-width="3">
    <ellipse cx="498" cy="346" rx="44" ry="14" fill="#B9D77A" transform="rotate(-12 498 346)"/>
    <ellipse cx="506" cy="360" rx="44" ry="14" fill="#C4DE8A" transform="rotate(-4 506 360)"/>
    <ellipse cx="510" cy="375" rx="42" ry="13" fill="#CFE59A" transform="rotate(6 510 375)"/>
  </g>
  <!-- chickpeas -->
  <g fill="#E8B86A" stroke="#C99A4E" stroke-width="2">
    <circle cx="330" cy="388" r="10"/><circle cx="350" cy="380" r="10"/><circle cx="318" cy="372" r="9"/><circle cx="342" cy="398" r="9"/>
  </g>
  <!-- tofu -->
  <g fill="#F6E7C1" stroke="#E2CC96" stroke-width="2">
    <rect x="392" y="366" width="24" height="22" rx="4" transform="rotate(-8 404 377)"/>
    <rect x="420" y="376" width="24" height="22" rx="4" transform="rotate(10 432 387)"/>
    <rect x="404" y="392" width="22" height="20" rx="4"/>
  </g>
  <!-- tomatoes -->
  <circle cx="460" cy="392" r="13" fill="#E86A4A"/>
  <circle cx="482" cy="402" r="12" fill="#F2994A"/>
  <circle cx="456" cy="388" r="4" fill="#FFFFFF" opacity=".5"/>
  <!-- seeds -->
  <g fill="#FBF4EA">
    <ellipse cx="380" cy="352" rx="3" ry="1.6"/><ellipse cx="440" cy="362" rx="3" ry="1.6"/><ellipse cx="368" cy="374" rx="3" ry="1.6"/><ellipse cx="480" cy="372" rx="3" ry="1.6"/>
  </g>
  <!-- herb sprig -->
  <path d="M120 520 C150 490 170 470 200 460" fill="none" stroke="#4E9A5B" stroke-width="4" stroke-linecap="round"/>
  <use href="#leaf" transform="translate(140 500) rotate(-80) scale(.6)"/>
  <use href="#leaf" transform="translate(160 482) rotate(10) scale(.6)"/>
  <use href="#leaf" transform="translate(180 470) rotate(-70) scale(.55)"/>
</svg>
