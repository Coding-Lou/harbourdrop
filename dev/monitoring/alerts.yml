groups:
  - name: dianping
    rules:
      - alert: BusinessEventsBacklog
        expr: max(hmdp_outbox_pending) > 200 or max(hmdp_outbox_inflight) > 200
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Business events are backing up: unsent, or due but not consumed"}
      - alert: BusinessEventsNeedReview
        expr: max(hmdp_outbox_review) > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Business events need manual review"}
      - alert: BusinessEventsSendRetry
        expr: sum(rate(hmdp_mq_sends_total{result="retry"}[5m])) > 0.1
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Kafka delivery not acknowledged; the outbox is retrying with backoff"}
      - alert: BehaviorConsumerStopped
        expr: hmdp_kafka_consumer_running == 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Kafka shop popularity consumer has stopped"}
      - alert: BehaviorConsumerBacklog
        expr: max(hmdp_kafka_consumer_lag) > 1000
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Kafka behavior consumer lag is over 1000 messages"}
      - alert: BehaviorVisitsDropped
        expr: sum(rate(hmdp_kafka_visits_total{result="dropped"}[5m])) > 1
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Visit stats are being dropped; check Kafka and the bounded send queue"}
      - alert: BehaviorEventsNeedReview
        expr: max(hmdp_analytics_outbox_review) > 0 or max(hmdp_analytics_outbox_pending) > 200
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Order analytics events are pending or need manual review"}
      - alert: DianpingApiDown
        expr: up{job="hmdp"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "HarbourDrop API or monitoring credentials unavailable"}
      - alert: CacheCdcDisconnected
        expr: (max(hmdp_cdc_connected) == 0) and (max(hmdp_cdc_enabled) == 1)
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "CDC (Debezium → Kafka) consumer has no partitions assigned"}
      - alert: CacheCdcPollingStalled
        expr: hmdp_cdc_poll_age_seconds > 30 and hmdp_cdc_connected == 1
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "CDC consumer has stopped polling"}
      - alert: CacheCdcRetries
        expr: sum(increase(hmdp_cdc_batches_total{result="retry"}[5m])) > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "CDC batches are replaying; check schema migrations and cache dependencies"}
      - alert: CacheCdcDelay
        expr: histogram_quantile(0.95, sum by(le)(rate(hmdp_cdc_event_delay_seconds_bucket[5m]))) > 10
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "CDC event processing delay is over 10 seconds"}
      - alert: SeckillBacklog
        expr: max(hmdp_seckill_lag) > 1000 or max(hmdp_seckill_pending) > 100
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Drop claim messages are backing up or too many are pending"}
      - alert: SeckillNeedsReview
        expr: max(hmdp_seckill_review) > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Some drop reservations need manual review"}
      - alert: SeckillConsumptionSlow
        expr: histogram_quantile(0.95, sum by(le)(rate(hmdp_seckill_consume_seconds_bucket[5m]))) > 1
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Drop claim consumption P95 is over 1 second"}
      - alert: ShopResponseSlow
        expr: histogram_quantile(0.95, sum by(le)(rate(http_server_requests_seconds_bucket{uri="/shop/{id}"}[5m]))) > 0.2
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Shop detail endpoint P95 is over 200 ms"}
