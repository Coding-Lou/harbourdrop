name: hm-dianping
services:
  kafka-volume-init:
    image: apache/kafka:3.9.1
    user: '0'
    entrypoint: [/bin/sh, -c]
    command: ['chown appuser:appuser /tmp/kraft-combined-logs']
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: '72'
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx512m'
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null']
      interval: 10s
      timeout: 8s
      retries: 30
  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint: [/bin/sh, -c]
    command: ['exec /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic HmdpShopBehavior --partitions 3 --replication-factor 1 --config retention.ms=259200000']
    depends_on:
      kafka:
        condition: service_healthy
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --sql-mode=NO_ENGINE_SUBSTITUTION --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --binlog-row-image=FULL --binlog-expire-logs-seconds=604800
    environment:
      MYSQL_ROOT_PASSWORD: ${HMDP_MYSQL_PASSWORD:-hmdp_local_only}
      MYSQL_DATABASE: hmdp
    volumes:
      - mysql-data:/var/lib/mysql
      - ../src/main/resources/db/hmdp.sql:/docker-entrypoint-initdb.d/01-hmdp.sql:ro
      - ./mysql/02-debezium.sql:/docker-entrypoint-initdb.d/02-debezium.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 3s
      retries: 60
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync always
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  cdc-user-init:
    # Creates the Debezium account on existing MySQL volumes too (initdb scripts only run once).
    image: mysql:8.0
    entrypoint: [/bin/sh, -c]
    command: ['mysql -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" < /init/02-debezium.sql']
    environment:
      MYSQL_ROOT_PASSWORD: ${HMDP_MYSQL_PASSWORD:-hmdp_local_only}
    volumes:
      - ./mysql/02-debezium.sql:/init/02-debezium.sql:ro
    depends_on:
      mysql:
        condition: service_healthy
  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: hmdp-connect
      CONFIG_STORAGE_TOPIC: hmdp_connect_configs
      OFFSET_STORAGE_TOPIC: hmdp_connect_offsets
      STATUS_STORAGE_TOPIC: hmdp_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: '1'
      OFFSET_STORAGE_REPLICATION_FACTOR: '1'
      STATUS_STORAGE_REPLICATION_FACTOR: '1'
      HEAP_OPTS: '-Xms256m -Xmx512m'
    ports:
      - '127.0.0.1:${HMDP_CONNECT_PORT:-8083}:8083'
    depends_on:
      kafka:
        condition: service_healthy
      cdc-user-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'curl -fs http://localhost:8083/connectors >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 60
  connect-init:
    # PUT is idempotent: creates the connector or updates its configuration.
    image: curlimages/curl:8.11.1
    command:
      - -fsS
      - -X
      - PUT
      - -H
      - 'Content-Type: application/json'
      - --data
      - '@/config/hmdp-cache-connector.json'
      - http://connect:8083/connectors/hmdp-cache/config
    volumes:
      - ./debezium/hmdp-cache-connector.json:/config/hmdp-cache-connector.json:ro
    depends_on:
      connect:
        condition: service_healthy
  otel-agent-init:
    # Fetches the pinned OpenTelemetry Java agent once into a volume (not committed to git).
    image: curlimages/curl:8.11.1
    user: '0'
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        test -s /otel/opentelemetry-javaagent-2.33.1.jar ||
        curl -fsSL -o /otel/opentelemetry-javaagent-2.33.1.jar
        https://repo1.maven.org/maven2/io/opentelemetry/javaagent/opentelemetry-javaagent/2.33.1/opentelemetry-javaagent-2.33.1.jar
    volumes:
      - otel-agent:/otel
  jaeger:
    # Trace UI at http://127.0.0.1:16686; receives OTLP from the Java agent.
    image: jaegertracing/jaeger:2.23.0
    profiles: [observability]
    ports:
      - '127.0.0.1:${HMDP_TRACING_UI_PORT:-16686}:16686'
  mailpit:
    # Local SMTP sink for login codes; open http://127.0.0.1:8025 to read them.
    image: axllent/mailpit:v1.21
    ports:
      - '127.0.0.1:${HMDP_MAIL_UI_PORT:-8025}:8025'
  java:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    # The agent is attached to the forked application JVM only, not to Maven itself.
    command:
      - mvn
      - -DskipTests
      - spring-boot:run
      - -Dspring-boot.run.jvmArguments=-javaagent:/otel/opentelemetry-javaagent-2.33.1.jar
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hmdp?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${HMDP_MYSQL_PASSWORD:-hmdp_local_only}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: '6379'
      SPRING_DATA_REDIS_PASSWORD: ''
      HMDP_CDC_ENABLED: 'true'
      HMDP_CDC_SCHEMA: hmdp
      HMDP_MQ_ENABLED: 'true'
      HMDP_MQ_SECKILL_ENABLED: 'true'
      HMDP_ANALYTICS_ENABLED: 'true'
      HMDP_EXPERIENCE_ENABLED: ${HMDP_EXPERIENCE_ENABLED:-true}
      HMDP_KAFKA_SERVERS: kafka:9092
      HMDP_MONITOR_TOKEN: ${HMDP_MONITOR_TOKEN:-hmdp_dev_metrics}
      HMDP_JWT_SECRET: ${HMDP_JWT_SECRET:-local-development-only-jwt-secret-change-me}
      HMDP_MAIL_ENABLED: 'true'
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: '1025'
      HMDP_UPLOAD_DIR: /uploads
      # Tracing is off unless HMDP_TRACING_ENABLED=true (start Jaeger with --profile observability).
      OTEL_JAVAAGENT_ENABLED: ${HMDP_TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: hmdp-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      CITYLENS_CATALOG_ADMIN_IDS: ${HMDP_ADMIN_IDS:-}
      CITYLENS_PAYMENT_MOCK_ENABLED: ${HMDP_PAYMENT_MOCK_ENABLED:-false}
    ports:
      - '127.0.0.1:${HMDP_API_PORT:-8081}:8081'
    volumes:
      - otel-agent:/otel:ro
      - ..:/workspace
      - maven-cache:/root/.m2
      - ${HMDP_UPLOAD_HOST_DIR:-./data/uploads}:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      connect-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
  web:
    image: nginx:alpine
    ports:
      - '127.0.0.1:${HMDP_WEB_PORT:-8080}:80'
    volumes:
      - ${HMDP_FRONTEND_DIR:-../frontend}:/usr/share/nginx/html:ro
      - ${HMDP_UPLOAD_HOST_DIR:-./data/uploads}:/usr/share/nginx/hmdp-images:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - java
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring, observability]
    entrypoint: [/bin/sh, /etc/prometheus/start.sh]
    environment:
      HMDP_MONITOR_TOKEN: ${HMDP_MONITOR_TOKEN:-hmdp_dev_metrics}
    ports:
      - '127.0.0.1:${HMDP_METRICS_PORT:-9091}:9090'
    volumes:
      - ./monitoring:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - java
      - alertmanager
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [monitoring, observability]
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    ports:
      - '127.0.0.1:${HMDP_ALERT_PORT:-9094}:9093'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
volumes:
  otel-agent:
  kafka-data:
  prometheus-data:
  alertmanager-data:
  mysql-data:
  redis-data:
  maven-cache:
